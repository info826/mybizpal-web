services:
  - type: web
    name: mybizpal-web
    env: static
    autoDeploy: true
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      # Clean URLs for static legal/info pages → actual .html files.
      # These must come BEFORE the SPA catch-all below.
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /gdpr
        destination: /gdpr.html
      - type: rewrite
        source: /cookies
        destination: /cookies.html
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /contact
        destination: /contact.html
      - type: rewrite
        source: /acceptable-use
        destination: /acceptable-use.html
      # SPA fallback — keep LAST so it only catches unmatched routes.
      - type: rewrite
        source: /*
        destination: /index.html
